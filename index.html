<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hellcastle Tic-Tac-Toe Darts</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-image: linear-gradient(rgba(18, 18, 18, 0.85), rgba(18, 18, 18, 0.85)), url('TicTacToe.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(30, 30, 30, 0.92);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
        }
        h1 {
            text-align: center;
            color: #ffca28;
            margin-top: 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .setup-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #bbb;
        }
        select, input[type="text"], button {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #2c2c2c;
            color: #fff;
            font-size: 16px;
            box-sizing: border-box;
        }
        .player-count-btns {
            display: flex;
            gap: 10px;
        }
        .count-btn {
            flex: 1;
            background: #333;
            cursor: pointer;
            font-weight: bold;
        }
        .count-btn.active {
            background: #ffca28;
            color: #121212;
            border-color: #ffca28;
        }
        .player-input-row {
            margin-bottom: 10px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            cursor: pointer;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            margin: 0;
            cursor: pointer;
        }
        .primary-btn {
            background: #4caf50;
            border: none;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .primary-btn:hover {
            background: #45a049;
        }

        /* Game Area */
        #game-area {
            display: none;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #252525;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 5px solid #ffca28;
        }
        .turn-indicator {
            font-size: 18px;
            font-weight: bold;
        }
        .darts-left {
            font-size: 16px;
            color: #aaa;
        }
        .multiplier-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        .mult-btn {
            flex: 1;
            background: #333;
            cursor: pointer;
            font-weight: bold;
            padding: 10px 5px;
        }
        .mult-btn.active {
            background: #2196f3;
            border-color: #2196f3;
            color: #fff;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .cell {
            background: #2a2a2a;
            border: 2px solid #444;
            border-radius: 8px;
            height: 95px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.1s;
        }
        .cell:active {
            transform: scale(0.96);
        }
        .cell-num {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
        }
        .cell-marks {
            font-size: 14px;
            margin-top: 5px;
            height: 18px;
            color: #ffca28;
            letter-spacing: 2px;
        }
        .cell-owner {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .controls-row {
            display: flex;
            gap: 10px;
        }
        .miss-btn {
            background: #d32f2f;
            border: none;
            font-weight: bold;
            cursor: pointer;
            flex: 2;
        }
        .undo-btn {
            background: #757575;
            border: none;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
        }
        .reset-btn {
            background: #555;
            border: none;
            margin-top: 15px;
            cursor: pointer;
        }
        .scoreboard {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .player-badge {
            flex: 1;
            min-width: 110px;
            background: #252525;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            border-bottom: 3px solid transparent;
        }
        #winner-banner {
            display: none;
            background: rgba(76, 175, 80, 0.2);
            border: 2px solid #4caf50;
            color: #a5d6a7;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        /* League Submission Bar */
        .league-submit-bar {
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: left;
            font-weight: normal;
        }
        .league-submit-bar label {
            color: #ffca28;
            font-size: 14px;
            margin-bottom: 2px;
        }
        .league-submit-bar select {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 10px;
            font-size: 15px;
        }
        .btn-league {
            background: linear-gradient(180deg, #48bb78, #2f855a);
            border: 1px solid rgba(104, 211, 145, 0.6);
            color: #ffffff;
            font-weight: 800;
            font-size: 16px;
            padding: 12px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 161, 105, 0.35);
        }
        .btn-league:hover {
            filter: brightness(1.06);
        }
        .league-sync-status {
            text-align: center;
            color: #ffca28;
            font-size: 13px;
            font-weight: bold;
        }

        /* Player Colors */
        .p0-bg { background-color: rgba(244, 67, 54, 0.25) !important; border-color: #f44336 !important; }
        .p0-tag { background: #f44336; color: #fff; }
        .p1-bg { background-color: rgba(33, 150, 243, 0.25) !important; border-color: #2196f3 !important; }
        .p1-tag { background: #2196f3; color: #fff; }
        .p2-bg { background-color: rgba(76, 175, 80, 0.25) !important; border-color: #4caf50 !important; }
        .p2-tag { background: #4caf50; color: #fff; }
        .p3-bg { background-color: rgba(255, 193, 7, 0.25) !important; border-color: #ffc107 !important; }
        .p3-tag { background: #ffc107; color: #000; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 Hellcastle Tic-Tac-Toe</h1>

    <!-- SETUP AREA -->
    <div id="setup-area">
        <div class="setup-group">
            <label>Select Player Count</label>
            <div class="player-count-btns">
                <button type="button" class="count-btn active" data-count="2">2 Players</button>
                <button type="button" class="count-btn" data-count="3">3 Players</button>
                <button type="button" class="count-btn" data-count="4">4 Players</button>
            </div>
        </div>
        <div class="setup-group" id="player-inputs">
            <!-- Dynamically generated -->
        </div>
        <div class="setup-group">
            <label for="board-type">Select Board Type</label>
            <select id="board-type">
                <option value="basic">Basic Board (Single, Double, Triple)</option>
                <option value="quad">Quad Board (Single, Double, Triple, Quad)</option>
            </select>
        </div>
        <label class="checkbox-group">
            <input type="checkbox" id="randomize-order">
            <span>Randomize player order</span>
        </label>
        <button type="button" class="primary-btn" id="start-btn">Start Game</button>
    </div>

    <!-- GAME AREA -->
    <div id="game-area">
        <div id="winner-banner">
            <div id="winner-text"></div>
            <div class="league-submit-bar">
                <label for="targetLeagueSelect">🏆 Submit Results to Hellcastle League:</label>
                <select id="targetLeagueSelect" aria-label="Target League">
                    <option value="Royal Couple">Royal Couple</option>
                    <option value="Papal 1">Papal 1</option>
                    <option value="Faubion 1">Faubion 1</option>
                </select>
                <button type="button" class="btn-league" id="sendToLeagueBtn">🚀 Send to League Form</button>
                <span class="league-sync-status" id="leagueSyncStatus"></span>
            </div>
        </div>

        <div class="status-bar">
            <div class="turn-indicator" id="turn-display">Player 1's Turn</div>
            <div class="darts-left" id="darts-display">Darts: 3</div>
        </div>

        <div class="multiplier-bar" id="multiplier-bar">
            <button type="button" class="mult-btn active" data-mult="1">Single (1)</button>
            <button type="button" class="mult-btn" data-mult="2">Double (2)</button>
            <button type="button" class="mult-btn" data-mult="3">Triple (3)</button>
            <button type="button" class="mult-btn" data-mult="4" id="quad-btn" style="display:none;">Quad (4)</button>
        </div>

        <div class="board" id="board">
            <!-- 9 Cells dynamically generated -->
        </div>

        <div class="controls-row">
            <button type="button" class="miss-btn" id="miss-btn">Miss / Other Number</button>
            <button type="button" class="undo-btn" id="undo-btn" disabled>Undo</button>
        </div>

        <div class="scoreboard" id="scoreboard">
            <!-- Player badges dynamically generated -->
        </div>

        <button type="button" class="reset-btn" id="reset-btn">New Game / Setup</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBvL2K8R82qk3fG4EEKZ6sOIiieLcCKckA",
        authDomain: "haal-fc862.firebaseapp.com",
        projectId: "haal-fc862",
        storageBucket: "haal-fc862.firebasestorage.app",
        messagingSenderId: "1077392905739",
        appId: "1:1077392905739:web:cc047fae886356663fd90e",
        measurementId: "G-P99RVN1XBF"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const LEAGUE_URL = "https://herbenero.github.io/Hellcastle-League/";

    // State Variables
    let playerCount = 2;
    let players = [];
    let boardType = 'basic';
    let currentPlayerIndex = 0;
    let dartsRemaining = 3;
    let currentMultiplier = 1;
    let gameOver = false;
    let winningPlayerIndex = null;
    let boardNumbers = [];
    let cells = [];
    let history = [];

    const winLines = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8], // Rows
        [0, 3, 6], [1, 4, 7], [2, 5, 8], // Cols
        [0, 4, 8], [2, 4, 6]             // Diagonals
    ];

    const playerColors = ['#f44336', '#2196f3', '#4caf50', '#ffc107'];

    // DOM Elements
    const setupArea = document.getElementById('setup-area');
    const gameArea = document.getElementById('game-area');
    const playerInputsContainer = document.getElementById('player-inputs');
    const boardEl = document.getElementById('board');
    const turnDisplay = document.getElementById('turn-display');
    const dartsDisplay = document.getElementById('darts-display');
    const quadBtn = document.getElementById('quad-btn');
    const scoreboardEl = document.getElementById('scoreboard');
    const winnerBanner = document.getElementById('winner-banner');
    const winnerText = document.getElementById('winner-text');
    const undoBtn = document.getElementById('undo-btn');

    async function loadSavedLeagues() {
        const select = document.getElementById('targetLeagueSelect');
        if (!select) return;
        try {
            const snapshot = await getDocs(collection(db, "leagues"));
            const seen = new Set();
            const options = [];

            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                const rawName = (data.leagueName || docSnap.id || "").trim();
                const norm = rawName.toLowerCase().replace(/[^a-z0-9]/g, "");
                if (rawName && !seen.has(norm)) {
                    seen.add(norm);
                    options.push(rawName);
                }
            });

            if (options.length > 0) {
                const prevVal = localStorage.getItem('haalis_selected_target_league') || select.value;
                select.innerHTML = options
                    .map(name => `<option value="${name.replace(/"/g, '&quot;')}">${name}</option>`)
                    .join("");
                const matched = options.find(o => o.toLowerCase() === prevVal.toLowerCase());
                if (matched) select.value = matched;
            }
        } catch (err) {
            console.error("Failed to fetch leagues from Firestore:", err);
        }
    }

    function sendToLeagueForm() {
        if (!players || players.length === 0) {
            alert("No player scores available to send.");
            return;
        }

        const select = document.getElementById('targetLeagueSelect');
        const selectedLeague = select ? select.value.trim() : "Royal Couple";
        localStorage.setItem('haalis_selected_target_league', selectedLeague);

        const boardLabel = boardType === 'quad' ? 'Quad Board' : 'Basic Board';

        const rankedPlayers = players
            .map((name, idx) => {
                const squaresOwned = cells.filter(c => c.owner === idx).length;
                const isTicTacToeWinner = winningPlayerIndex === idx;
                const notesParts = [`${squaresOwned}/9 squares claimed`];
                if (isTicTacToeWinner) {
                    notesParts.unshift("3-in-a-row Victory");
                }
                notesParts.push(boardLabel);

                return {
                    name: name,
                    score: squaresOwned,
                    notes: notesParts.join(" | ")
                };
            })
            .sort((a, b) => b.score - a.score);

        const payload = {
            leagueName: selectedLeague,
            event: "Tic Tac Toe",
            timestamp: new Date().toISOString(),
            players: rankedPlayers
        };

        try {
            localStorage.setItem("haalis_pending_match", JSON.stringify(payload));
        } catch (e) {
            console.warn("localStorage unavailable, relying on URL payload:", e);
        }

        const statusEl = document.getElementById('leagueSyncStatus');
        if (statusEl) {
            statusEl.textContent = `Sending results to ${selectedLeague}...`;
        }

        const targetUrl = new URL(LEAGUE_URL);
        targetUrl.searchParams.set("league", selectedLeague);
        targetUrl.searchParams.set("event", "Tic Tac Toe");
        targetUrl.searchParams.set("match", JSON.stringify(payload));
        window.location.href = targetUrl.toString();
    }

    // Initialize Player Inputs
    function renderPlayerInputs() {
        const currentValues = Array.from(playerInputsContainer.querySelectorAll('input')).map(i => i.value);
        playerInputsContainer.innerHTML = '';
        for (let i = 0; i < playerCount; i++) {
            const div = document.createElement('div');
            div.className = 'player-input-row';
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = `Player ${i + 1} Name`;
            input.value = currentValues[i] || `Player ${i + 1}`;
            div.appendChild(input);
            playerInputsContainer.appendChild(div);
        }
    }

    // Player Count Selection
    document.querySelectorAll('.count-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.count-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            playerCount = parseInt(btn.dataset.count, 10);
            renderPlayerInputs();
        });
    });

    // Multiplier Selection
    document.querySelectorAll('.mult-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            if (gameOver) return;
            document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMultiplier = parseInt(btn.dataset.mult, 10);
        });
    });

    // Start Game
    document.getElementById('start-btn').addEventListener('click', () => {
        const inputs = playerInputsContainer.querySelectorAll('input');
        players = Array.from(inputs).map((input, idx) => input.value.trim() || `Player ${idx + 1}`);

        if (document.getElementById('randomize-order').checked) {
            for (let i = players.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [players[i], players[j]] = [players[j], players[i]];
            }
        }

        boardType = document.getElementById('board-type').value;
        quadBtn.style.display = boardType === 'quad' ? 'block' : 'none';

        setupArea.style.display = 'none';
        gameArea.style.display = 'block';
        initGame();
    });

    // Generate 9 Unique Numbers (1-20 + Bull=25)
    function generateBoardNumbers() {
        const pool = Array.from({ length: 20 }, (_, i) => i + 1);
        pool.push(25); // Bullseye

        for (let i = pool.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [pool[i], pool[j]] = [pool[j], pool[i]];
        }
        return pool.slice(0, 9);
    }

    function initGame() {
        currentPlayerIndex = 0;
        dartsRemaining = 3;
        currentMultiplier = 1;
        gameOver = false;
        winningPlayerIndex = null;
        history = [];
        winnerBanner.style.display = 'none';
        const statusEl = document.getElementById('leagueSyncStatus');
        if (statusEl) statusEl.textContent = '';
        resetMultiplierUI();

        boardNumbers = generateBoardNumbers();
        cells = boardNumbers.map(num => ({
            number: num,
            marks: Array(players.length).fill(0),
            owner: null
        }));

        renderScoreboard();
        renderBoard();
        updateStatus();
    }

    function saveHistory() {
        history.push({
            currentPlayerIndex,
            dartsRemaining,
            gameOver,
            winningPlayerIndex,
            cells: JSON.parse(JSON.stringify(cells))
        });
        undoBtn.disabled = false;
    }

    undoBtn.addEventListener('click', () => {
        if (history.length === 0) return;
        const prev = history.pop();
        currentPlayerIndex = prev.currentPlayerIndex;
        dartsRemaining = prev.dartsRemaining;
        gameOver = prev.gameOver;
        winningPlayerIndex = prev.winningPlayerIndex;
        cells = prev.cells;
        winnerBanner.style.display = 'none';

        if (history.length === 0) undoBtn.disabled = true;

        renderBoard();
        renderScoreboard();
        updateStatus();
    });

    function resetMultiplierUI() {
        currentMultiplier = 1;
        document.querySelectorAll('.mult-btn').forEach(b => b.classList.remove('active'));
        document.querySelector('.mult-btn[data-mult="1"]').classList.add('active');
    }

    function renderScoreboard() {
        scoreboardEl.innerHTML = '';
        players.forEach((p, idx) => {
            const badge = document.createElement('div');
            badge.className = 'player-badge';
            badge.style.borderBottomColor = playerColors[idx];
            const ownedCount = cells.filter(c => c.owner === idx).length;
            badge.innerHTML = `<strong>${p}</strong><br><span style="color:#aaa">Squares: ${ownedCount}</span>`;
            scoreboardEl.appendChild(badge);
        });
    }

    function renderBoard() {
        boardEl.innerHTML = '';
        cells.forEach((cell, idx) => {
            const div = document.createElement('div');
            div.className = 'cell';
            if (cell.owner !== null) {
                div.classList.add(`p${cell.owner}-bg`);
            }

            const numLabel = cell.number === 25 ? 'BULL' : cell.number;
            const currentMarks = cell.marks[currentPlayerIndex];
            let markStr = '';
            if (cell.owner === null && currentMarks > 0) {
                markStr = '/'.repeat(currentMarks);
            }

            let ownerTag = '';
            if (cell.owner !== null) {
                ownerTag = `<span class="cell-owner p${cell.owner}-tag">${players[cell.owner].substring(0, 6)}</span>`;
            }

            div.innerHTML = `
                ${ownerTag}
                <div class="cell-num">${numLabel}</div>
                <div class="cell-marks">${markStr}</div>
            `;

            div.addEventListener('click', () => handleCellClick(idx));
            boardEl.appendChild(div);
        });
    }

    function handleCellClick(index) {
        if (gameOver) return;
        saveHistory();

        const cell = cells[index];
        // Limit Bullseye to max 2x (Double Bull)
        let effectiveMult = (cell.number === 25 && currentMultiplier > 2) ? 2 : currentMultiplier;

        if (cell.owner === null) {
            cell.marks[currentPlayerIndex] += effectiveMult;
            if (cell.marks[currentPlayerIndex] >= 3) {
                cell.marks[currentPlayerIndex] = 3;
                cell.owner = currentPlayerIndex;
            }
        }

        consumeDart();
    }

    document.getElementById('miss-btn').addEventListener('click', () => {
        if (gameOver) return;
        saveHistory();
        consumeDart();
    });

    function consumeDart() {
        resetMultiplierUI();
        renderBoard();
        renderScoreboard();

        if (checkWin()) return;

        dartsRemaining--;
        if (dartsRemaining <= 0) {
            dartsRemaining = 3;
            currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
        }
        updateStatus();
    }

    function checkWin() {
        // 1. Check 3-in-a-row win condition
        for (let line of winLines) {
            const [a, b, c] = line;
            if (cells[a].owner !== null &&
                cells[a].owner === cells[b].owner &&
                cells[a].owner === cells[c].owner) {
                endGame(cells[a].owner);
                return true;
            }
        }

        // 2. Check if all 9 squares are claimed (Tiebreaker by total squares)
        const allClaimed = cells.every(c => c.owner !== null);
        if (allClaimed) {
            let counts = players.map((_, idx) => cells.filter(c => c.owner === idx).length);
            let maxSquares = Math.max(...counts);
            let winners = players.filter((_, idx) => counts[idx] === maxSquares);

            gameOver = true;
            winningPlayerIndex = winners.length === 1 ? counts.indexOf(maxSquares) : null;
            winnerText.textContent = winners.length === 1
                ? `🏆 ${winners[0]} Wins with ${maxSquares} squares!`
                : `🤝 Tie Game! (${winners.join(' & ')} with ${maxSquares} squares each)`;
            winnerBanner.style.display = 'block';
            turnDisplay.textContent = "Game Over!";
            dartsDisplay.textContent = "";
            loadSavedLeagues();
            return true;
        }

        return false;
    }

    function endGame(winnerIdx) {
        gameOver = true;
        winningPlayerIndex = winnerIdx;
        winnerText.textContent = `🏆 ${players[winnerIdx]} Wins with 3-in-a-Row!`;
        winnerBanner.style.display = 'block';
        turnDisplay.textContent = "Game Over!";
        dartsDisplay.textContent = "";
        loadSavedLeagues();
    }

    function updateStatus() {
        if (gameOver) return;
        turnDisplay.textContent = `${players[currentPlayerIndex]}'s Turn`;
        turnDisplay.style.color = playerColors[currentPlayerIndex];
        dartsDisplay.textContent = `Darts: ${dartsRemaining}`;
        renderBoard(); // Refresh marks display for the active player
    }

    document.getElementById('reset-btn').addEventListener('click', () => {
        gameArea.style.display = 'none';
        setupArea.style.display = 'block';
    });

    document.getElementById('sendToLeagueBtn').addEventListener('click', sendToLeagueForm);

    // Boot
    renderPlayerInputs();
    loadSavedLeagues();
